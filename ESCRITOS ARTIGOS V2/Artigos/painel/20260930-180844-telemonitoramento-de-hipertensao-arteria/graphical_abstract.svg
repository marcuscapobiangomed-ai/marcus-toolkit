    <circle cx="30" cy="22" r="10" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.5" />
    <text x="30" y="26" text-anchor="middle" font-size="11" font-weight="bold" fill="#fbbf24">3</text>
