      <path d="M15 28 L28 15 C30 13 33 13 35 15 C37 17 37 20 35 22 L22 35 C20 37 17 37 15 35 C13 33 13 30 15 28 Z" fill="none" stroke="#a78bfa" stroke-width="2" />
