  <!-- ================= FOOTER / CRÉDITOS ================= -->
  <line x1="0" y1="586" x2="1200" y2="586" stroke="#1e293b" stroke-width="1" />
  <text x="36" y="608" font-size="11" fill="#64748b">Autores: Pesquisador Responsável</text>
  <text x="1164" y="608" text-anchor="end" font-size="11" fill="#64748b">
