    <text x="36" y="130" font-size="38" font-weight="800" fill="#10b981" letter-spacing="-1">p &lt; 0.05</text>
    <text x="145" y="112" font-size="12" font-weight="700" fill="#34d399">Evidência consistente em 37 estudos</text>
    <text x="145" y="130" font-size="11" font-weight="500" fill="#a7f3d0">Conforme intervalo das fontes pr...</text>

