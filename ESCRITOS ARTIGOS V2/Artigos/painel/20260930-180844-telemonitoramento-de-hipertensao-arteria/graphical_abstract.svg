  <text x="1164" y="42" text-anchor="end" font-size="12" font-weight="600" fill="#10b981">
    ✓ PRISMA 2020 &amp; GRADE Compliant
  </text>

  <!-- Título Principal do Estudo -->
  <text x="36" y="74" font-size="18" font-weight="700" fill="#ffffff" letter-spacing="-0.3">Telemonitoramento de hipertensão arterial sistêmica e diabetes mellitus na Atenção Prim...</text>

